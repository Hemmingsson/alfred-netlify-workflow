<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signed-out login page and sign-in action</title><style>html,body{margin:0;background:#fff}svg{max-width:100%;height:auto}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="537" viewBox="0 0 1200 537" role="img" aria-labelledby="title desc"><title id="title">Signed-out login page and sign-in action</title><desc id="desc">Documentation wireframe based on the shipped Alfred window. Dashed slots show flexible content; solid fills show controls and selection.</desc><style>
:root{--sc-paper:#fff;--sc-ink:#050505;--sc-muted:#626262;--sc-soft:#878787;--sc-fill:#f3f3f3;--sc-fill2:#e8e8e8;color-scheme:light}
svg{display:block;background:#fff;color:#050505;font-family:'SF Mono',ui-monospace,Menlo,monospace}
