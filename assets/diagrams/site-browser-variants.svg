<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="357" viewBox="0 0 1200 357" role="img" aria-labelledby="title desc"><title id="title">Preview variants</title><desc id="desc">Documentation wireframe based on the shipped Alfred window. Dashed slots show flexible content; solid fills show controls and selection.</desc><style>
:root{--sc-paper:#fff;--sc-ink:#050505;--sc-muted:#626262;--sc-soft:#878787;--sc-fill:#f3f3f3;--sc-fill2:#e8e8e8;color-scheme:light}
svg{display:block;background:#fff;color:#050505;font-family:'SF Mono',ui-monospace,Menlo,monospace}
.well{fill:#f3f3f3;stroke:#050505;stroke-width:1.4}
.hug{fill:#e8e8e8;stroke:#050505;stroke-width:1.1}
.slot{fill:none;stroke:#626262;stroke-width:.8;stroke-dasharray:3 4;stroke-linecap:round}
.empty{fill:none;stroke:#878787;stroke-width:.9;stroke-dasharray:7 5}
.thin{fill:none;stroke:#050505;stroke-width:1}
.rel{fill:none;stroke:#878787;stroke-width:.7;stroke-dasharray:4 5;stroke-linecap:round}
.lead{fill:none;stroke:#878787;stroke-width:.8;stroke-linecap:round;stroke-linejoin:round}
.skeleton{fill:#d5d5d5;stroke:none}
.action{fill:#e8e8e8;stroke:#c4c4c4;stroke-width:.8}
.actiontext{font-size:12px;fill:#303030}
.key{font-size:12px;fill:#626262}
.dt{font-size:12px;fill:#050505;paint-order:stroke;stroke:#fff;stroke-width:3px}
.sl{font:500 9px 'SF Mono',ui-monospace,Menlo,monospace;fill:#626262;letter-spacing:.06em}
.message{font-size:19px;font-weight:600;fill:#050505}.detail{font-size:14px;fill:#050505}.button{font-size:13px;font-weight:600;fill:#050505}
.vt{font:500 17px 'SF Mono',ui-monospace,Menlo,monospace;fill:#050505}
</style><rect width="1200" height="357" fill="#ffffff"/><g transform="translate(0 -74)"><text x="24" y="98" class="vt" text-anchor="start">Live page</text><text x="24" y="118" class="sl" text-anchor="start">Framing allowed; page loaded</text><rect x="24" y="132" width="366" height="30" rx="0" class="well"/><g transform="translate(31 140) scale(0.5833333333333334)" fill="none" stroke="#626262" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 L7 12 L15 20"/></g><g transform="translate(51 140) scale(0.5833333333333334)" fill="none" stroke="#626262" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 L17 12 L9 20"/></g><g transform="translate(71 140) scale(0.5833333333333334)" fill="none" stroke="#626262" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 8 A8 8 0 1 0 20 14 M19 3 V8 H14"/></g><g transform="translate(95 140) scale(0.5833333333333334)" fill="none" stroke="#626262" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12 H21 M5 7 H19 M5 17 H19"/></g><rect x="115" y="138" width="264" height="18" rx="3" class="slot"/><text x="247.0" y="150.0" class="sl" text-anchor="middle">ADDRESS</text><rect x="24" y="162" width="366" height="205" rx="0" class="well"/><rect x="39" y="177" width="336" height="24" rx="3" class="slot"/><text x="207.0" y="192.0" class="sl" text-anchor="middle">PAGE HEADER</text><rect x="39" y="216" width="205" height="99" rx="3" class="slot"/><text x="141.5" y="268.5" class="sl" text-anchor="middle">PAGE CONTENT</text><rect x="259" y="216" width="116" height="99" rx="3" class="slot"/><text x="317.0" y="268.5" class="sl" text-anchor="middle">CONTENT</text><text x="207" y="349" class="sl" text-anchor="middle">DESKTOP WEB PAGE</text><rect x="24" y="384" width="366" height="23" rx="3" class="slot"/><text x="207.0" y="398.5" class="sl" text-anchor="middle">PROJECT + DEPLOY DETAILS</text><text x="417" y="98" class="vt" text-anchor="start">Picture fallback</text><text x="417" y="118" class="sl" text-anchor="start">Framing refused, pending or demo</text><rect x="417" y="132" width="366" height="30" rx="0" class="well"/><g transform="translate(424 140) scale(0.5833333333333334)" fill="none" stroke="#626262" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 L7 12 L15 20"/></g><g transform="translate(444 140) scale(0.5833333333333334)" fill="none" stroke="#626262" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 L17 12 L9 20"/></g><g transform="translate(464 140) scale(0.5833333333333334)" fill="none" stroke="#626262" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 8 A8 8 0 1 0 20 14 M19 3 V8 H14"/></g><g transform="translate(488 140) scale(0.5833333333333334)" fill="none" stroke="#626262" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12 H21 M5 7 H19 M5 17 H19"/></g><rect x="508" y="138" width="264" height="18" rx="3" class="slot"/><text x="640.0" y="150.0" class="sl" text-anchor="middle">ADDRESS</text><rect x="417" y="162" width="366" height="205" rx="0" class="well"/><path d="M429,174 L771,355 M771,174 L429,355" class="rel"/><rect x="417" y="384" width="366" height="23" rx="3" class="slot"/><text x="600.0" y="398.5" class="sl" text-anchor="middle">PROJECT + DEPLOY DETAILS</text><text x="810" y="98" class="vt" text-anchor="start">No preview</text><text x="810" y="118" class="sl" text-anchor="start">Never published or no site URL</text><rect x="810" y="132" width="366" height="30" rx="0" class="well"/><g transform="translate(817 140) scale(0.5833333333333334)" fill="none" stroke="#626262" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 L7 12 L15 20"/></g><g transform="translate(837 140) scale(0.5833333333333334)" fill="none" stroke="#626262" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 L17 12 L9 20"/></g><g transform="translate(857 140) scale(0.5833333333333334)" fill="none" stroke="#626262" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 8 A8 8 0 1 0 20 14 M19 3 V8 H14"/></g><g transform="translate(881 140) scale(0.5833333333333334)" fill="none" stroke="#626262" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12 H21 M5 7 H19 M5 17 H19"/></g><rect x="901" y="138" width="264" height="18" rx="3" class="slot"/><text x="1033.0" y="150.0" class="sl" text-anchor="middle">ADDRESS</text><rect x="810" y="162" width="366" height="205" rx="0" class="empty"/><text x="993" y="270" class="sl" text-anchor="middle">No published page</text><rect x="810" y="384" width="366" height="23" rx="3" class="slot"/><text x="993.0" y="398.5" class="sl" text-anchor="middle">PROJECT + DEPLOY DETAILS</text></g></svg>
