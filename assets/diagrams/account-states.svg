<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc"><title id="title">Account states</title><desc id="desc">Documentation wireframe based on the shipped Alfred window. Dashed slots show flexible content; solid fills show controls and selection.</desc><style>

svg{display:block;background:var(--sc-paper);color:var(--sc-ink);font-family:'SF Mono',ui-monospace,Menlo,monospace}
.well{fill:var(--sc-fill);stroke:var(--sc-ink);stroke-width:1.4}
.hug{fill:var(--sc-fill2);stroke:var(--sc-ink);stroke-width:1.1}
.slot{fill:none;stroke:var(--sc-muted);stroke-width:.8;stroke-dasharray:3 4;stroke-linecap:round}
.empty{fill:none;stroke:var(--sc-soft);stroke-width:.9;stroke-dasharray:7 5}
.thin{fill:none;stroke:var(--sc-ink);stroke-width:1}
.rel{fill:none;stroke:var(--sc-soft);stroke-width:.7;stroke-dasharray:4 5;stroke-linecap:round}
.lead{fill:none;stroke:var(--sc-soft);stroke-width:.8;stroke-linecap:round;stroke-linejoin:round}
.skeleton{fill:var(--sc-skeleton);stroke:none}
.action{fill:var(--sc-fill2);stroke:var(--sc-border);stroke-width:.8}
.actiontext{font-size:12px;fill:var(--sc-ink)}
.key{font-size:12px;fill:var(--sc-muted)}
.dt{font-size:12px;fill:var(--sc-ink);paint-order:stroke;stroke:var(--sc-paper);stroke-width:3px}
.sl{font:500 9px 'SF Mono',ui-monospace,Menlo,monospace;fill:var(--sc-muted);letter-spacing:.06em}
.message{font-size:19px;font-weight:600;fill:var(--sc-ink)}.detail{font-size:14px;fill:var(--sc-ink)}.button{font-size:13px;font-weight:600;fill:var(--sc-ink)}
.vt{font:500 17px 'SF Mono',ui-monospace,Menlo,monospace;fill:var(--sc-ink)}
svg:root{--sc-paper:#ffffff;--sc-paper-2:#f3f3f3;--sc-ink:#050505;--sc-ink-strong:#030303;--sc-muted:#626262;--sc-soft:#878787;--sc-fill:#f3f3f3;--sc-fill2:#e8e8e8;--sc-skeleton:#d5d5d5;--sc-border:#c4c4c4;--sc-rule-solid:#bebebe;--sc-rule:#dedede;--sc-accent:#050505;--sc-accent-tint:#e8e8e8;--sc-link:#050505;--sc-node:#ffffff;--sc-store:#f3f3f3;--sc-external:#f8f8f8;color-scheme:light dark}@media (prefers-color-scheme:dark){svg:root{--sc-paper:#17191d;--sc-paper-2:#22252b;--sc-ink:#eeeeef;--sc-ink-strong:#ffffff;--sc-muted:#b6bac3;--sc-soft:#8c929e;--sc-fill:#22252b;--sc-fill2:#30343c;--sc-skeleton:#555c69;--sc-border:#626a79;--sc-rule-solid:#626a79;--sc-rule:#3d434e;--sc-accent:#eeeeef;--sc-accent-tint:#30343c;--sc-link:#eeeeef;--sc-node:#22252b;--sc-store:#22252b;--sc-external:#1d2025;}}</style><rect width="1200" height="290" fill="var(--sc-paper)"/><g transform="translate(0 0)"><text x="24" y="24" class="vt" text-anchor="start">Signed out</text><rect x="24" y="41" width="366" height="226" rx="6" class="thin"/><rect x="71" y="102" width="272" height="24" rx="3" class="slot"/><text x="207.0" y="117.0" class="sl" text-anchor="middle">MESSAGE</text><rect x="71" y="137" width="272" height="18" rx="3" class="slot"/><text x="207.0" y="149.0" class="sl" text-anchor="middle">DETAIL</text><rect x="127" y="185" width="160" height="25" rx="3" class="action"/><text x="207.0" y="200.5" class="sl" text-anchor="middle">SIGN IN</text><text x="417" y="24" class="vt" text-anchor="start">Connecting</text><rect x="417" y="41" width="366" height="226" rx="6" class="thin"/><rect x="464" y="102" width="272" height="24" rx="3" class="slot"/><text x="600.0" y="117.0" class="sl" text-anchor="middle">MESSAGE</text><rect x="464" y="137" width="272" height="18" rx="3" class="slot"/><text x="600.0" y="149.0" class="sl" text-anchor="middle">DETAIL</text><rect x="491" y="185" width="110" height="25" rx="3" class="action"/><text x="546.0" y="200.5" class="sl" text-anchor="middle">TRY AGAIN</text><rect x="611" y="185" width="98" height="25" rx="3" class="action"/><text x="660.0" y="200.5" class="sl" text-anchor="middle">CANCEL</text><text x="810" y="24" class="vt" text-anchor="start">First refresh failed</text><rect x="810" y="41" width="366" height="226" rx="6" class="thin"/><rect x="857" y="102" width="272" height="24" rx="3" class="slot"/><text x="993.0" y="117.0" class="sl" text-anchor="middle">MESSAGE</text><rect x="857" y="137" width="272" height="18" rx="3" class="slot"/><text x="993.0" y="149.0" class="sl" text-anchor="middle">DETAIL</text><rect x="913" y="185" width="160" height="25" rx="3" class="action"/><text x="993.0" y="200.5" class="sl" text-anchor="middle">RETRY</text></g></svg>
